# Production reads DATABASE_URL (ox provides it); Rails merges it over this.
# Locally, libpq's PGHOST, PGPORT and PGUSER pick the server.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 2 %>
  connect_timeout: 5
  variables:
    statement_timeout: 5000

development:
  <<: *default
  database: rails_queue_development

test:
  <<: *default
  database: rails_queue_test

production:
  <<: *default
